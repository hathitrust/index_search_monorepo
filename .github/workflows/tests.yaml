name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  # Fast lane: tests that need no Solr, MySQL or RabbitMQ.
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install workspace
        run: uv sync --package ht-utils --package ht-search --package data-operations

      - name: Run unit tests
        run: uv run pytest -m "not integration" libs app/data_operations/tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Ruff
        run: |
          uv run ruff check --no-fix app libs
          uv run ruff format --check app libs

      # mypy --strict coverage is being rolled out incrementally; currently scoped to
      # libs and app/ht_indexer. Other apps will be added as they're annotated.
      - name: Mypy
        run: uv run mypy libs app/ht_indexer

  # Run tests
  test_indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Indexer
        run: |
          docker compose --profile ht-indexer_tests up -d --wait

      - name: Run tests
        run: |
          DOCKER_COMPOSE_PROFILES=ht-indexer_tests docker compose run --rm ht-indexer_tests

      # 👇 ADD DEBUG STEP HERE
      - name: Dump ZooKeeper logs
        if: failure()
        run: docker logs zoo1
      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2

  test_solr_query:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Set up Solr
          run: |
            docker compose --profile solr-query_tests up -d --wait

        - name: Run tests
          run: |
            DOCKER_COMPOSE_PROFILES=solr-query_tests docker compose run --rm solr-query_tests
