name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  # Fast lane: tests that need no Solr, MySQL or RabbitMQ.
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install workspace
        run: uv sync --package ht-utils --package ht-search --package data-operations

      - name: Run unit tests
        run: uv run pytest -m "not integration" libs app/data_operations/tests --cov=libs --cov-report=term-missing --cov-report=xml

      # Coveralls matches files by the XML filename attribute relative to the repo
      # root, but coverage writes them relative to the --cov source (libs/).
      - name: Rewrite coverage paths
        run: sed -i 's#filename="#filename="libs/#' coverage.xml

      - name: Report to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.7
        with:
          github-token: ${{ secrets.github_token }}
          file: coverage.xml
          flag-name: unit
          parallel: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Ruff
        run: |
          uv run ruff check --no-fix app libs
          uv run ruff format --check app libs

      # mypy --strict coverage is being rolled out incrementally; currently scoped to
      # libs and app/ht_indexer. Other apps will be added as they're annotated.
      - name: Mypy
        run: uv run mypy libs app/ht_indexer

  # Run tests
  test_indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: |
          # Bind-mounted into the ht-indexer_tests container as /workspace/coverage.
          # Docker auto-creates missing bind-mount sources as root-owned, which the
          # container's non-root user couldn't write to -- create it writable first.
          mkdir -p coverage
          chmod 777 coverage
          docker compose run --rm ht-indexer_tests

      # Same fix as unit_tests: make filenames repo-relative (--cov=src makes them
      # relative to app/ht_indexer/src).
      - name: Rewrite coverage paths
        run: sed -i 's#filename="#filename="app/ht_indexer/src/#' coverage/coverage.xml

      - name: Report to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.7
        with:
          github-token: ${{ secrets.github_token }}
          file: coverage/coverage.xml
          flag-name: indexer
          parallel: true

      # 👇 ADD DEBUG STEP HERE
      - name: Dump ZooKeeper logs
        if: failure()
        run: docker logs zoo1
      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2

  test_solr_query:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Run tests
          run: |
            docker compose run --rm solr-query_tests

  # Merge the parallel unit/indexer reports into one Coveralls build per commit.
  # Coverage scope is libs (unit) and app/ht_indexer (indexer) only, so
  # test_solr_query and the other apps are intentionally not reported.
  coveralls_finished:
    needs: [unit_tests, test_indexer]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.7
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
