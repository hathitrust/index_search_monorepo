x-condition-healthy: &healthy
  condition: service_healthy

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  start_period: 30s
  retries: 5

# Common environment variables for all services
x-env-common: &env_common
    CATALOG_SOLR_RO_URL: http://solr-sdr-catalog:9033/solr/catalog/
    FULL_TEXT_SOLR_RO_URL: http://admin:solrRocks@solr-lss-dev:8983/solr/core-x
    SOLR_USER: admin
    SOLR_PASSWORD: solrRocks

# Environment variables specific to the indexer services
x-env-indexer: &env_indexer
    RABBITMQ_INDEXER_RW_HOST: rabbitmq
    RABBITMQ_INDEXER_RW_PORT: 5672
    RABBITMQ_INDEXER_RW_USERNAME: guest
    RABBITMQ_INDEXER_RW_PASSWORD: guest
    MYSQL_HT_RO_HOST: mysql-sdr
    MYSQL_HT_RO_USERNAME: mdp-admin
    MYSQL_HT_RO_PASSWORD: mdp-admin
    MYSQL_HT_RO_DATABASE: ht
    SDR_DIR: /sdr1/obj

# Common + indexer environment merged once, so services reference a single alias
# instead of `<<: [*env_common, *env_indexer]`, which trips the compose schema linter
x-env-common-indexer: &env_common_indexer
    <<: [*env_common, *env_indexer]

services:
  ht-indexer-tracker:
    profiles: [ ht-indexer ]
    # image: ht-indexer
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: ht-indexer
        APP_DIR: ht_indexer
    environment:
      << : *env_common_indexer
      PACKAGE: ht_indexer
    depends_on:
      solr-sdr-catalog: *healthy
      mysql-sdr: *healthy
    tty: true
    stdin_open: true
  document-retriever:
    profiles: [ ht-indexer ]
    # image: ht-indexer
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: ht-indexer
        APP_DIR: ht_indexer
    volumes:
      - ../tmp:/tmp
      - ./app/ht_indexer:/app
      - ../sdr1/obj:/sdr1/obj
    ports:
      - "8081:8081"
    environment:
      << : *env_common_indexer
      QUEUE_NAME: retriever_queue
    depends_on:
      solr-sdr-catalog: *healthy
      rabbitmq: *healthy
      mysql-sdr: *healthy
    tty: true
    stdin_open: true
    command: [ "/workspace/.venv/bin/python", "-m" ,"document_retriever_service.full_text_search_retriever_service", "--query_field", "item",
               "--parallelize" ]
  mysql-sdr:
    image: ghcr.io/hathitrust/db-image:latest
    volumes:
      - mysql_sdr_data:/var/lib/mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      <<: *env_indexer
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [ "CMD", "healthcheck.sh", "--su-mysql", "--connect" ]
      timeout: 30s
      retries: 3
  solr-lss-dev:
    image: ghcr.io/hathitrust/full-text-search-cloud:solr9-shards-docker
    ports:
      - "8983:8983"
    environment:
      <<: *env_common
      ZK_HOST: zoo1:2181
      SOLR_OPTS: -XX:-UseLargePages
      SOLR_MODULES: analysis-extras
      SOLR_AUTHENTICATION_OPTS: -Dbasicauth=solr:solrRocks
    depends_on:
      zoo1: *healthy
    volumes:
      - solr1_data:/var/solr
    # start solr in the background, wait for it to start, then create the collection
    command: [ "sh", "-c", "solr-foreground & /usr/bin/create_collection_if_needed && wait" ]
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD-SHELL", "bin/solr healthcheck -c core-x" ]
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 10
  zoo1: # Zookeeper run in standalone mode for development and testing purposes. In production, we would use a Zookeeper ensemble for high availability.
    image: zookeeper:3.9.0
    restart: "always"
    hostname: zoo1
    ports:
      - 2181:2181
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok
    volumes:
      - zoo1_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "nc", "-z", "-w", "2", "localhost", "2181"] # Check if ZooKeeper is listening on port 2181
  solr-sdr-catalog:
    image: ghcr.io/hathitrust/catalog-solr-sample-standalone:solr-standalone
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "/usr/bin/curl", "-s", "-f", "http://localhost:9033/solr/catalog/admin/ping" ]
      interval: 5s
    ports:
      - "9033:9033"
    expose:
      - 9033
  document-generator:
    profiles: [ ht-indexer ]
    # image: ht-indexer
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: ht-indexer
        APP_DIR: ht_indexer
    volumes:
      - ../tmp:/tmp:rm
      - ../sdr1/obj:/sdr1/obj
      - ./app/ht_indexer:/app
    depends_on:
      rabbitmq: *healthy
      mysql-sdr: *healthy
    tty: true
    stdin_open: true
    environment:
      <<: *env_indexer
      RABBITMQ_INDEXER_SRC_RW_HOST: rabbitmq
      RABBITMQ_INDEXER_SRC_RW_PORT: 5672
      RABBITMQ_INDEXER_SRC_RW_USERNAME: guest
      RABBITMQ_INDEXER_SRC_RW_PASSWORD: guest
      RABBITMQ_INDEXER_SRC_RW_QUEUE_NAME: retriever_queue
      RABBITMQ_INDEXER_TGT_RW_HOST: rabbitmq
      RABBITMQ_INDEXER_TGT_RW_PORT: 5672
      RABBITMQ_INDEXER_TGT_RW_USERNAME: guest
      RABBITMQ_INDEXER_TGT_RW_PASSWORD: guest
      RABBITMQ_INDEXER_TGT_RW_QUEUE_NAME: indexer_queue
      TGT_QUEUE_PASS: guest
      TGT_QUEUE_USER: guest
    command: ["/workspace/.venv/bin/python", "-m" ,"document_generator.document_generator_service" ]
  document-indexer:
    profiles: [ ht-indexer ]
    # image: ht-indexer
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: ht-indexer
        APP_DIR: ht_indexer
    volumes:
      - ../tmp:/tmp:rm
      - ../sdr1/obj:/sdr1/obj
      - ./app/ht_indexer:/app
    ports:
      - "8082:8082"
    depends_on:
      solr-lss-dev: *healthy
      rabbitmq: *healthy
    tty: true
    stdin_open: true
    environment:
      << : *env_common_indexer
      QUEUE_NAME: indexer_queue
    command: ["/workspace/.venv/bin/python", "-m","document_indexer_service.document_indexer_service", "--solr_indexing_api", "http://solr-lss-dev:8983/solr/#/core-x/", "--batch_size", "100" ]
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 5s
      timeout: 10s
  ht-indexer-tests:
    profiles: [ ht-indexer-tests ]
    # image: ht-indexer
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: ht-indexer
        APP_DIR: ht_indexer
    volumes:
      - ./app/ht_indexer:/workspace/app/ht_indexer
      - ./app/ht_indexer/tests:/workspace/app/ht_indexer/tests
      - ../tmp:/tmp
      - ../sdr1/obj:/sdr1/obj
      # Coverage data lands here so it's readable outside the container -- e.g. for
      # a future Coveralls upload step. The host-side ./coverage dir must exist and
      # be writable by the container's non-root user before this runs (see the "Set
      # up Indexer" CI step), or this hits the same bind-mount permission problem
      # COVERAGE_FILE below already works around for /workspace itself.
      - ./coverage:/workspace/coverage
    command: ["/workspace/.venv/bin/python", "-m", "pytest", "tests", "--cov=src", "--cov-report=term-missing"]
    environment:
      <<: *env_common_indexer
      SOLR_URL: http://solr-sdr-catalog:9033/solr/catalog/
      COVERAGE_FILE: /workspace/coverage/.coverage
    depends_on:
      solr-sdr-catalog: *healthy
      solr-lss-dev: *healthy
      rabbitmq: *healthy
      mysql-sdr: *healthy
  ###############################SolrQueryInterface###############################
  solr-query-api:
    profiles: [ solr-query ]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: solr-query
        APP_DIR: solr_query
    stdin_open: true
    depends_on:
      solr-lss-dev: *healthy
    tty: true
    ports:
      - "8000:8000"
    environment:
      <<: *env_common
    command: [ "/workspace/.venv/bin/python", "-m", "ht_full_text_search.main", "--env",  "dev"]
  data-loader: # It is probably for this application I should create the image first
    profiles: [ solr-query, solr-query-tests ]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: solr-query
        APP_DIR: solr_query
    stdin_open: true
    tty: true
    environment:
      <<: *env_common
    depends_on:
      solr-lss-dev: *healthy
    entrypoint: ["/bin/sh", "-c" ,"src/indexing_data.sh http://solr-lss-dev:8983 src/solr_dataset core-x" ]
  solr-query-tests:
    profiles: [ solr-query-tests ]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_NAME: solr-query
        APP_DIR: solr_query
    environment: *env_common
    command: [ "/workspace/.venv/bin/python", "-m", "pytest"]
    depends_on:
      solr-lss-dev: *healthy
      data-loader:
        condition: service_completed_successfully
###############################data_operations-MARC###############################
  data-operations:
      profiles: [ data-operations ]
      build:
        context: .
        dockerfile: Dockerfile
        target: runtime
        args:
          APP_NAME: data-operations
          APP_DIR: data_operations
          MODULE_NAME: metadata_extractor
      volumes:
        - ./app/data_operations/src/metadata_extractor/data:/app/src/metadata_extractor/data:ro
        - ./app/data_operations/src/metadata_extractor/output:/app/src/metadata_extractor/output
      tty: true
      stdin_open: true
############ Volumes ## ############################
volumes:
  mysql_sdr_data:
  solr1_data: null
  zoo1_data: null
  mysql_retriever_data:
