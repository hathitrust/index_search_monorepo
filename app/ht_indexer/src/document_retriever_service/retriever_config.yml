# Queue configuration file for retriever service

queue:
    # The name of the queue
    queue_name: retriever_queue
    batch_size: 1
    requeue_message: false
    shutdown_on_empty_queue: false
    # The queue type
    exchange_type: direct
    # The queue durable flag
    durable: true
    # The queue auto delete flag
    auto_delete: false
    # The queue exclusive flag
    exclusive: false
    # The queue arguments
    arguments: { }
    # The queue heartbeat interval
    heartbeat: 0
    # The queue connection timeout
    connection_timeout: 10
    # The queue retry interval
    retry_interval: 5
    # Largest message body in bytes. Must not exceed the RabbitMQ broker's max_message_size.
    # 64 MiB: fits all but a few very large volumes; oversized ones are logged
    # ("exceeds max_message_size") and not published. Safe on rabbitmq:3.13-management (512 MiB default).
    # RabbitMQ 4.x defaults to 16 MiB (https://www.rabbitmq.com/docs/limits#:~:text=unlimited-,max_message_size,-integer%20(bytes)),
    # so on 4.x set max_message_size >= 67108864 in its rabbitmq.conf.
    max_message_size: 67108864
