# Queue configuration file for retriever service

queue:
    # The name of the queue
    queue_name: indexer_queue
    # How many messages are read from the queue and sent to Solr in one request (1 to 65535).
    # The --batch_size command-line option overrides it.
    batch_size: 10
    requeue_message: false
    # How many times a message may be put back on the queue after Solr answers its own request
    # with a 5xx, before it is sent to the Dead Letter Queue
    max_retries: 5
    shutdown_on_empty_queue: false
    # The queue type
    exchange_type: direct
    # The queue durable flag
    durable: true
    # The queue auto delete flag
    auto_delete: false
    # The queue exclusive flag
    exclusive: false
    # The queue arguments
    arguments: { }
    # The queue heartbeat interval
    heartbeat: 0
    # The queue connection timeout
    connection_timeout: 10
    # The queue retry interval
    retry_interval: 5
