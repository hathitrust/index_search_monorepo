# Queue configuration file for retriever service

src_queue:
    # The name of the queue
    queue_name: retriever_queue
    batch_size: 1
    requeue_message: false
    shutdown_on_empty_queue: false
    # The queue type
    exchange_type: direct
    # The queue durable flag
    durable: true
    # The queue auto delete flag
    auto_delete: false
    # The queue exclusive flag
    exclusive: false
    # The queue arguments
    arguments: { }
    # The queue heartbeat interval
    heartbeat: 600
    # The queue connection timeout
    connection_timeout: 10
    # The queue retry interval
    retry_interval: 5
tgt_queue:
    # The name of the queue
    queue_name: indexer_queue
    batch_size: 1
    requeue_message: false
    shutdown_on_empty_queue: false
    # The queue type
    exchange_type: direct
    # The queue durable flag
    durable: true
    # The queue auto delete flag
    auto_delete: false
    # The queue exclusive flag
    exclusive: false
    # The queue arguments
    arguments: { }
    # The queue heartbeat interval
    heartbeat: 600
    # The queue connection timeout
    connection_timeout: 10
    # The queue retry interval
    retry_interval: 5
    # Largest message body in bytes. Must not exceed the RabbitMQ broker's max_message_size.
    # 16 MiB is the RabbitMQ 4.x default (https://www.rabbitmq.com/docs/limits#:~:text=unlimited-,max_message_size,-integer%20(bytes))
    # and is also safe on rabbitmq:3.13-management, whose default is 128 MiB.
    max_message_size: 16777216
